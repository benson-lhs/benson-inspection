<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>벤슨 매장 점검</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#17233B; --ink-2:#3A4760; --muted:#6B7586; --line:#D9DEE6; --line-2:#E9EDF2;
  --paper:#F2F4F7; --surface:#FFFFFF;
  --yes:#1E7A5A; --yes-bg:#E3F2EC; --no:#C2364B; --no-bg:#FBE6E9; --pending:#CBD2DC;
  --focus:#3B6FD8; --warn-bg:#FFF4D6; --warn:#7A5600;
  --radius:12px;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.who b{font-weight:600;color:var(--ink)}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 12px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.demo-bar{background:var(--warn-bg);color:var(--warn);font-size:13px;text-align:center;padding:6px 12px}

main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
main.narrow{max-width:720px}
h1{font-size:22px;line-height:1.3;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* 버튼·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#0F1A2E}
.btn.danger{color:var(--no);border-color:#E7B7BF}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea.in{min-height:72px;resize:vertical;line-height:1.5}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.row>.btn{flex:0 0 auto}
.err{color:var(--no);font-size:13px;margin-top:8px;min-height:1em}

/* 카드·목록 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:inherit}
.li:hover{border-color:var(--ink-2)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.score{font-weight:700;font-size:18px;text-align:right;min-width:64px}
.score small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.done{background:var(--yes-bg);color:var(--yes)}
.chip.back{background:var(--no-bg);color:var(--no)}
.chip.wait{background:var(--warn-bg);color:var(--warn)}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist .num{color:var(--muted);margin-right:6px}
.bulk{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.stat.click{cursor:pointer;text-align:left;font:inherit}
.stat.click:hover{border-color:var(--ink-2)}
.stat.on{border-color:var(--warn);background:var(--warn-bg)}
.notice.wait{background:var(--warn-bg);color:var(--warn)}
.notice.done{background:var(--yes-bg);color:#14533D}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}

/* 표 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:#F8F9FB}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#F6F8FB}
td.wrap{white-space:normal;min-width:180px}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--no)}
.bar.y i{background:var(--yes)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}

/* 점검 화면 */
.ins-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.ins-head h1{margin:0}
.ins-meta{font-size:13px;color:var(--muted)}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.notice.back{background:var(--no-bg);color:#7D1F2E}
.notice.info{background:#E8EEF9;color:#1E3A72}
.cat{margin-top:22px}
.cat-h{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.cat-h .k{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.cat-h h2{margin:0;font-size:16px}
.cat-h .c{margin-left:auto;font-size:13px;color:var(--muted)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;scroll-margin-top:120px;border-left:4px solid var(--pending)}
.item.y{border-left-color:var(--yes)}
.item.n{border-left-color:var(--no)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item-no{flex:none;width:24px;font-weight:700;color:var(--muted);font-size:14px;padding-top:1px}
.item-t{font-weight:700;font-size:16px;line-height:1.35}
.item-c{color:var(--ink-2);font-size:14px;margin:4px 0 12px 34px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-left:34px}
.yn button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.yn button[aria-pressed="true"].y{background:var(--yes);border-color:var(--yes);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--no);border-color:var(--no);color:#fff}
.yn button:disabled{cursor:default}
.item-body{margin:10px 0 0 34px}
.item-body textarea{min-height:56px}
.only-flag .item.plain{display:none}
.ro-note{white-space:pre-wrap;font-size:14px;background:#F8F9FB;border-radius:8px;padding:8px 10px;margin-top:8px}
.ro-result{margin-left:34px;font-weight:700}
.ro-result.y{color:var(--yes)}
.ro-result.n{color:var(--no)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--line-2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(23,35,59,.78);color:#fff;font-size:15px;line-height:24px;padding:0}
.ph .lnk{display:grid;place-items:center;width:100%;height:100%;font-size:12px;color:var(--ink-2);text-decoration:none;text-align:center;padding:4px}
.ph.up::after{content:"올리는 중";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);font-size:12px;font-weight:600}
.add-ph{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--muted);background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;display:grid;place-items:center;text-align:center;line-height:1.3}
.add-ph input{display:none}

/* 하단 진행 막대 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:720px;margin:0 auto}
.rail{display:flex;gap:10px;margin-bottom:10px}
.rail .grp{display:flex;gap:3px;flex:var(--n)}
.rail button{flex:1;height:14px;border:0;border-radius:3px;background:var(--pending);padding:0}
.rail button.y{background:var(--yes)}
.rail button.n{background:var(--no)}
.dock-row{display:flex;align-items:center;gap:12px}
.dock-row .st{flex:1;font-size:13px;color:var(--muted);line-height:1.35}
.dock-row .st b{color:var(--ink);font-weight:700}
.has-dock{padding-bottom:150px}

/* 로그인 */
.login{max-width:380px;margin:9vh auto 0;padding:0 16px}
.login h1{font-size:26px;margin-bottom:4px}
.login .panel{margin-top:18px}

/* 모달·토스트·확대 */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,38,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:420px;padding:20px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(15,22,38,.25)}
.has-dock ~ .toast,.toast.up{bottom:150px}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(10,14,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.zoom img{max-width:100%;max-height:82vh;object-fit:contain}
.zoom .acts{display:flex;gap:8px;margin-top:12px}
.zoom .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.uid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:#F8F9FB;border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.split{grid-template-columns:1.2fr 1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important;transition:none !important}}
@media (min-width:720px){html{scroll-behavior:smooth}}
</style>
</head>

  const [y, m] = ym.split("-").map(Number);
  return { from: `${ym}-01`, to: `${ym}-${pad(new Date(y, m, 0).getDate())}` };
}
function emptyItems() {
  const o = {};
  CHECKLIST.forEach(c => { o[c.no] = { r: "", note: "", photos: [] }; });
  return o;
}
function itemOf(doc, key) {
  if (key === SPECIAL_KEY) return doc.special || (doc.special = { note: "", photos: [] });
  doc.items = doc.items || {};
  return doc.items[key] || (doc.items[key] = { r: "", note: "", photos: [] });
}
function summarize(items) {
  let y = 0, n = 0;
  CHECKLIST.forEach(c => { const v = items?.[c.no]?.r; if (v === "Y") y++; else if (v === "N") n++; });
  return { y, n, answered: y + n, total: CHECKLIST.length, rate: Math.round((y / CHECKLIST.length) * 100) };
}
function photoCount(doc) {
  let k = (doc.special?.photos || []).length;
  CHECKLIST.forEach(c => { k += (doc.items?.[c.no]?.photos || []).length; });

}
function nTitles(doc) {

}

const isSubmitted = d => d.status === "submitted" || d.status === "approved";
const withHist = (d, action, note = "") => [...(d.history || []), { at: Date.now(), by: S.me?.name || "", action, ...(note ? { note } : {}) }];

function toast(msg, ms = 2600) {

  const t = document.createElement("div");
  t.className = "toast" + ($(".dock") ? " up" : "");

function modal({ title, body = "", ok = "확인", cancel = "취소", danger = false, input = null }) {
  return new Promise(resolve => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>
      ${body ? `<div class="muted" style="white-space:pre-line">${body}</div>` : ""}
      ${input ? `<textarea class="in" style="margin-top:10px" placeholder="${esc(input.placeholder || "")}">${esc(input.value || "")}</textarea>` : ""}
      <div class="acts">
        ${cancel ? `<button class="btn" data-a="no">${esc(cancel)}</button>` : ""}
        <button class="btn ${danger ? "danger" : "primary"}" data-a="ok">${esc(ok)}</button>
      </div></div>`;
    document.body.appendChild(bg);
    const ta = $("textarea", bg);
    (ta || $("[data-a=ok]", bg)).focus();
    const done = v => { bg.remove(); resolve(v); };
    bg.addEventListener("click", e => {
      const a = e.target.closest("[data-a]")?.dataset.a;
      if (a === "ok") done(input ? ta.value.trim() : true);
      else if (a === "no" || e.target === bg) done(input ? null : false);
    });
    bg.addEventListener("keydown", e => { if (e.key === "Escape") done(input ? null : false); });
  });
}
function zoom(photo) {
  const z = document.createElement("div");
  z.className = "zoom";
  z.innerHTML = `<img alt="점검 사진" src="${esc(bigOf(photo))}">
    <div class="acts"><a class="btn sm" href="${esc(photo.url)}" target="_blank" rel="noopener">원본 열기</a><button class="btn sm" data-close>닫기</button></div>`;
  document.body.appendChild(z);
  const close = () => z.remove();
  z.addEventListener("click", e => { if (e.target === z || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", k); } });
}
const bigOf = p => p.big || (p.thumb ? p.thumb.replace(/sz=w\d+/, "sz=w1600") : p.url);

/* 사진 압축: 긴 변 PHOTO_MAX_SIDE, JPEG */
async function compressImage(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    src = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error("사진을 읽을 수 없습니다. JPG 또는 PNG 사진을 올려 주세요."));
      img.src = URL.createObjectURL(file);
    });
  }
  const w = src.width, h = src.height;
  const s = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", PHOTO_QUALITY));
  if (!blob) throw new Error("사진 변환에 실패했습니다.");
  return blob;
}
const blobToBase64 = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(",")[1]);
  fr.onerror = () => rej(new Error("사진을 읽지 못했습니다."));
  fr.readAsDataURL(blob);
});

   4. 데이터 계층 — Firebase(실사용) / 미리보기(데모)

let api;

async function createFirebaseApi() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}`;
  const [A, AU, FS] = await Promise.all([
    import(`${base}/firebase-app.js`),
    import(`${base}/firebase-auth.js`),
    import(`${base}/firebase-firestore.js`)
  ]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  const db = FS.getFirestore(app);
  const ts = () => FS.serverTimestamp();
  const asObj = d => ({ id: d.id, ...d.data() });

  async function callPhotoServer(payload) {
    if (!PHOTO_UPLOAD_URL) throw new Error("사진 업로드 주소(PHOTO_UPLOAD_URL)가 설정되지 않았습니다.");
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(PHOTO_UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ ...payload, idToken })
    });
    let j;
    try { j = await res.json(); } catch { throw new Error("사진 서버 응답을 읽지 못했습니다. Apps Script 배포 설정을 확인해 주세요."); }
    if (!j.ok) throw new Error(j.error || "사진 처리에 실패했습니다.");
    return j;
  }

  return {
    mode: "firebase",
    onAuth(cb) { AU.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)); },
    async login(email, pw) { await AU.signInWithEmailAndPassword(auth, email, pw); },
    async logout() { await AU.signOut(auth); },
    async changePassword(pw) { await AU.updatePassword(auth.currentUser, pw); },

    async getMember(uid) {
      const s = await FS.getDoc(FS.doc(db, "members", uid));
      return s.exists() ? { uid, ...s.data() } : null;
    },
    async listMembers() {
      const q = await FS.getDocs(FS.collection(db, "members"));
      return q.docs.map(d => ({ uid: d.id, ...d.data() }));
    },
    async createMember({ name, email, password, role }) {
      const sec = A.initializeApp(FIREBASE_CONFIG, "create-" + Date.now());
      try {
        const secAuth = AU.initializeAuth(sec, { persistence: AU.inMemoryPersistence });
        const cred = await AU.createUserWithEmailAndPassword(secAuth, email, password);
        const uid = cred.user.uid;
        await AU.signOut(secAuth);
        await FS.setDoc(FS.doc(db, "members", uid), { name, email, role, active: true, createdAt: ts() });
        return uid;
      } finally { await A.deleteApp(sec); }
    },
    async registerMember(uid, { name, email, role }) {
      await FS.setDoc(FS.doc(db, "members", uid), { name, email, role, active: true, createdAt: ts() });
    },
    async updateMember(uid, patch) { await FS.updateDoc(FS.doc(db, "members", uid), patch); },

    async listStores() {
      const q = await FS.getDocs(FS.collection(db, "stores"));
      return q.docs.map(asObj);
    },
    async addStore(data) {
      const r = await FS.addDoc(FS.collection(db, "stores"), { ...data, active: true, createdAt: ts() });
      return r.id;
    },
    async updateStore(id, patch) { await FS.updateDoc(FS.doc(db, "stores", id), patch); },
    async setStore(id, data) { await FS.setDoc(FS.doc(db, "stores", id), { ...data, createdAt: ts() }, { merge: true }); },

    async listMyInspections(uid) {
      const q = await FS.getDocs(FS.query(FS.collection(db, "inspections"), FS.where("svUid", "==", uid)));
      return q.docs.map(asObj);
    },
    async listInspections(from, to) {
      const q = await FS.getDocs(FS.query(FS.collection(db, "inspections"),
        FS.where("visitDate", ">=", from), FS.where("visitDate", "<=", to), FS.orderBy("visitDate", "desc")));
      return q.docs.map(asObj);
    },
    async getInspection(id) {
      const s = await FS.getDoc(FS.doc(db, "inspections", id));
      return s.exists() ? asObj(s) : null;
    },
    async createInspection(data) {
      const r = await FS.addDoc(FS.collection(db, "inspections"), { ...data, createdAt: ts(), updatedAt: ts() });
      return r.id;
    },
    async updateInspection(id, patch, { stamp = "" } = {}) {
      const p = { ...patch, updatedAt: ts() };
      if (stamp) p[stamp] = ts();
      await FS.updateDoc(FS.doc(db, "inspections", id), p);
    },
    async deleteInspection(id) { await FS.deleteDoc(FS.doc(db, "inspections", id)); },

    async uploadPhoto(blob, meta) {
      const data = await blobToBase64(blob);
      const j = await callPhotoServer({ action: "upload", data, mimeType: blob.type || "image/jpeg", ...meta });
      return { id: j.id, url: j.url, thumb: j.thumb };
    },
    async deletePhoto(id) { await callPhotoServer({ action: "delete", fileId: id }); }
  };
}

function createDemoApi() {
  const db = { members: {}, stores: {}, inspections: {} };
  let cb = () => {}, current = null, seq = 100;
  const nid = p => `${p}${++seq}`;
  const wait = () => sleep(120);
  const clone = o => JSON.parse(JSON.stringify(o));
  const svg = (label, color) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="${color}"/><text x="200" y="210" font-size="34" text-anchor="middle" fill="#fff" font-family="sans-serif">${label}</text></svg>`);

  [...new Set(STORE_SEED.map(x => x[2]))].forEach((n, i) => {
    db.members["demo-sv" + (i + 1)] = { name: n, email: `sv${i + 1}@example.com`, role: "sv", active: true };
  });
  db.members["demo-master"] = { name: "마스터 예시", email: "master@example.com", role: "master", active: true };
  const uidByName = n => Object.keys(db.members).find(k => db.members[k].name === n) || "";
  STORE_SEED.forEach(([code, name, sv]) => { db.stores[code] = { code, name, svName: sv, svUid: uidByName(sv), active: true }; });

  // 지난달·이번 달 예시 점검
  const now = new Date();
  const mk = (code, dayOffset, pattern, status = "submitted") => {
    const d = new Date(now); d.setDate(now.getDate() - dayOffset);
    const st = db.stores[code];
    const items = emptyItems();
    CHECKLIST.forEach((c, i) => { items[c.no].r = pattern[i] === "n" ? "N" : "Y"; });
    const n1 = CHECKLIST.find((c, i) => pattern[i] === "n");
    if (n1) {
      items[n1.no].note = "기준 미달 확인, 점장에게 즉시 개선 요청함.";
      items[n1.no].photos = [{ id: "p" + code + dayOffset, url: svg("예시 사진", "#7A8699"), thumb: svg("예시 사진", "#7A8699") }];
    }
    const id = nid("ins");
    db.inspections[id] = {
      storeId: code, storeCode: code, storeName: st.name, svUid: st.svUid, svName: db.members[st.svUid].name,
      visitDate: ymd(d), status, returned: false, items, special: { note: code === "BSC0009" ? "출입문 자동문 센서 오작동, 시설팀 접수 필요." : "", photos: [] },
      summary: summarize(items), checklistVersion: CHECKLIST_VERSION, createdAt: d.getTime(), updatedAt: d.getTime(), submittedAt: d.getTime(),
      history: [{ at: d.getTime(), by: db.members[st.svUid].name, action: "제출" }],
      ...(status === "approved" ? { approvedBy: "마스터 예시", approvedByUid: "demo-master", approvedAt: d.getTime() + 3600e3 } : {})
    };
    if (status === "approved") db.inspections[id].history.push({ at: d.getTime() + 3600e3, by: "마스터 예시", action: "승인" });
  };
  mk("BSC0007", 1, "yyyyyyyyyyyy"); mk("BSC0008", 3, "yyyyyyyyyyyn", "approved"); mk("BSC0021", 6, "yyyynyyyyyyy", "approved");
  mk("BSC0005", 2, "yyyyyyyyyyyy"); mk("BSC0009", 4, "ynyyyyyyynyy", "approved"); mk("BSC0016", 7, "yyyyyynyyyyy", "approved");
  mk("BSC0015", 2, "yyyyyyyynyyy"); mk("BSC0024", 5, "yyyyyyyyyyyy", "approved");
  mk("BSC0013", 1, "yyyyyynyyyyn"); mk("BSC0014", 3, "yyyyyyyyyyyy", "approved"); mk("BSC0010", 8, "yyyynyyyyyyy", "approved");
  mk("BSC0007", 33, "yyyyynyyyyyy", "approved"); mk("BSC0013", 36, "nyyyyyyyyyyy", "approved");

  return {
    mode: "demo",
    onAuth(f) { cb = f; setTimeout(() => cb(current), 0); },
    async login(uid) { await wait(); current = { uid, email: db.members[uid].email }; cb(current); },
    async logout() { current = null; cb(null); },
    async changePassword() { await wait(); },
    async getMember(uid) { await wait(); return db.members[uid] ? { uid, ...clone(db.members[uid]) } : null; },
    async listMembers() { await wait(); return Object.entries(db.members).map(([uid, m]) => ({ uid, ...clone(m) })); },
    async createMember({ name, email, role }) { await wait(); const uid = nid("u"); db.members[uid] = { name, email, role, active: true }; return uid; },
    async registerMember(uid, { name, email, role }) { await wait(); db.members[uid] = { name, email, role, active: true }; },
    async updateMember(uid, patch) { await wait(); Object.assign(db.members[uid], patch); },
    async listStores() { await wait(); return Object.entries(db.stores).map(([id, s]) => ({ id, ...clone(s) })); },
    async addStore(data) { await wait(); const id = nid("st"); db.stores[id] = { ...data, active: true }; return id; },
    async setStore(id, data) { await wait(); db.stores[id] = { ...(db.stores[id] || {}), ...clone(data) }; },
    async updateStore(id, patch) { await wait(); Object.assign(db.stores[id], patch); },
    async listMyInspections(uid) { await wait(); return Object.entries(db.inspections).filter(([, d]) => d.svUid === uid).map(([id, d]) => ({ id, ...clone(d) })); },
    async listInspections(from, to) {
      await wait();
      return Object.entries(db.inspections).filter(([, d]) => d.visitDate >= from && d.visitDate <= to)
        .map(([id, d]) => ({ id, ...clone(d) })).sort((a, b) => b.visitDate.localeCompare(a.visitDate));
    },
    async getInspection(id) { await wait(); return db.inspections[id] ? { id, ...clone(db.inspections[id]) } : null; },
    async createInspection(data) { await wait(); const id = nid("ins"); db.inspections[id] = { ...clone(data), createdAt: Date.now(), updatedAt: Date.now() }; return id; },
    async updateInspection(id, patch, { stamp = "" } = {}) {
      await wait();
      Object.assign(db.inspections[id], clone(patch), { updatedAt: Date.now() }, stamp ? { [stamp]: Date.now() } : {});
    },
    async deleteInspection(id) { await wait(); delete db.inspections[id]; },
    async uploadPhoto(blob) { await sleep(500); const u = URL.createObjectURL(blob); return { id: nid("ph"), url: u, thumb: u, big: u }; },
    async deletePhoto() { await wait(); }
  };
}

    if (a === "no" || e.target === bg) return bg.remove();
    if (a !== "ok") return;
    const p1 = $("#pw1", bg).value, p2 = $("#pw2", bg).value;
    if (p1.length < 6) return $("#pwErr", bg).textContent = "비밀번호는 6자 이상이어야 합니다.";
    if (p1 !== p2) return $("#pwErr", bg).textContent = "두 비밀번호가 다릅니다.";
    try { await api.changePassword(p1); bg.remove(); toast("비밀번호를 변경했습니다."); }
    catch (err) { $("#pwErr", bg).textContent = friendlyError(err); }
  });
}

async function confirmLeave() {
  if (!leaveGuard || !leaveGuard.nav()) return true;
  return modal({ title: "아직 끝나지 않은 작업이 있습니다", body: "사진을 올리는 중이거나 저장에 실패한 내용이 있습니다. 그래도 나가시겠어요?", ok: "나가기", danger: true });
}
window.addEventListener("beforeunload", e => { if (leaveGuard && leaveGuard.unload()) { e.preventDefault(); e.returnValue = ""; } });

let lastHash = location.hash;
async function router() {
  if (!S.me) return;
  if (leaveGuard && location.hash !== lastHash) {
    const go = await confirmLeave();
    if (!go) { history.replaceState(null, "", lastHash); return; }
  }
  leaveGuard = null;
  lastHash = location.hash;
  const h = location.hash || (isMaster() ? "#/admin" : "#/");
  const parts = h.replace(/^#\/?/, "").split("/");
  try {
    if (parts[0] === "" ) return await viewHome();
    if (parts[0] === "new") return await viewNew();
    if (parts[0] === "i" && parts[1]) return await viewInspection(parts[1], parts[2] === "edit");
    if (parts[0] === "admin" && isMaster()) {
      if (!parts[1]) return await viewAdminList();
      if (parts[1] === "stats") return await viewAdminStats();
      if (parts[1] === "stores") return await viewAdminStores();
      if (parts[1] === "users") return await viewAdminUsers();
    }
    location.hash = isMaster() ? "#/admin" : "#/";
  } catch (e) {
    console.error(e);
    shell(`<div class="empty">${esc(friendlyError(e))}<br><br><a class="btn sm" href="#/">처음으로</a></div>`, { narrow: true });
  }
}
window.addEventListener("hashchange", router);

async function loadStores() {
  S.stores = (await api.listStores()).sort((a, b) => (!a.code) - (!b.code) || (a.code || "").localeCompare(b.code || "") || a.name.localeCompare(b.name, "ko"));
}
async function loadMembers() { S.members = (await api.listMembers()).sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko")); }
const memberName = uid => S.members.find(m => m.uid === uid)?.name || "";
// 담당 SV: 계정이 연결돼 있으면 계정, 아니면 매장 목록의 담당자 이름으로 찾습니다.
const svUidOf = s => s.svUid || S.members.find(m => m.active !== false && m.name === s.svName)?.uid || "";
const svNameOf = s => memberName(s.svUid) || s.svName || "";
const isMyStore = s => s.svUid ? s.svUid === S.me.uid : (!!s.svName && s.svName === S.me.name);
const byName = arr => [...arr].sort((a, b) => a.name.localeCompare(b.name, "ko"));
async function linkStoresTo(uid, name) {
  await loadStores();
  const targets = S.stores.filter(s => !s.svUid && s.svName === name);
  for (const s of targets) await api.updateStore(s.id, { svUid: uid });
  return targets.length;
}

async function viewHome() {
  shell(`<p class="muted">불러오는 중…</p>`, { active: "#/", narrow: true });
  const list = (await api.listMyInspections(S.me.uid))
    .sort((a, b) => (b.visitDate || "").localeCompare(a.visitDate || "") || (Number(b.updatedAt?.seconds || b.updatedAt || 0) - Number(a.updatedAt?.seconds || a.updatedAt || 0)));
  const drafts = list.filter(d => !isSubmitted(d));
  const done = list.filter(isSubmitted);
  const monthDone = done.filter(d => d.visitDate?.startsWith(thisMonth())).length;
  const row = d => {
    const sm = d.summary || summarize(d.items);
    const n = nTitles(d);
    return `<a class="li" href="#/i/${esc(d.id)}">
      <div class="main"><div class="t">${esc(d.storeName)}</div>
        <div class="s">${fmtDate(d.visitDate)} ${statusChip(d)}${n.length ? ` 미흡: ${esc(n.join(", "))}` : ""}</div></div>
      <div class="score num">${sm.y}/${sm.total}<small>준수</small></div></a>`;
  };
  shell(`
    <h1>내 점검</h1>
    <a class="btn primary block" href="#/new" style="min-height:52px;font-size:16px">새 점검 시작</a>
    <p class="muted small" style="margin-top:10px">이번 달 제출 <b class="num">${monthDone}</b>건</p>
    ${drafts.length ? `<h2>작성 중</h2><div class="list">${drafts.map(row).join("")}</div>` : ""}
    <h2>제출한 점검</h2>
    ${done.length ? `<div class="list">${done.slice(0, 60).map(row).join("")}</div>` : `<div class="empty">아직 제출한 점검이 없습니다. 매장에 도착하면 '새 점검 시작'을 누르세요.</div>`}
  `, { active: "#/", narrow: true });
}

async function viewNew() {
  await loadStores();
  const active = S.stores.filter(s => s.active !== false);
  const mine = byName(active.filter(isMyStore));
  const others = byName(active.filter(s => !isMyStore(s)));
  const opt = s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`;
  shell(`
    <h1>새 점검 시작</h1>
    ${active.length ? `<div class="panel">
      <label class="f" for="st" style="margin-top:0">매장</label>
      <select class="in" id="st"><option value="">매장을 고르세요</option>
        ${mine.length ? `<optgroup label="내 담당 매장">${mine.map(opt).join("")}</optgroup><optgroup label="다른 매장">${others.map(opt).join("")}</optgroup>` : byName(active).map(opt).join("")}
      </select>
      <label class="f" for="vd">방문일</label><input class="in" id="vd" type="date" value="${today()}" max="${today()}">
      <div class="err" id="ne"></div>
      <button class="btn primary block" id="go" style="margin-top:6px">점검 시작</button>
    </div>` : `<div class="empty">등록된 매장이 없습니다. ${isMaster() ? `<a href="#/admin/stores">매장 관리</a>에서 매장을 먼저 추가하세요.` : "관리자에게 매장 등록을 요청하세요."}</div>`}
  `, { active: "#/", narrow: true });
  if (!active.length) return;
  $("#go").addEventListener("click", async () => {
    const st = S.stores.find(s => s.id === $("#st").value);
    const vd = $("#vd").value;
    if (!st) return $("#ne").textContent = "매장을 골라 주세요.";
    if (!vd) return $("#ne").textContent = "방문일을 입력해 주세요.";
    $("#go").disabled = true;
    try {
      const mineList = await api.listMyInspections(S.me.uid);
      const dup = mineList.find(d => d.storeId === st.id && d.visitDate === vd);
      if (dup) {
        const open = await modal({ title: "같은 날 같은 매장 점검이 있습니다", body: `${st.name}, ${fmtDate(vd)} 점검을 이미 만들었습니다. 그 점검을 열까요?`, ok: "기존 점검 열기", cancel: "새로 만들기" });
        if (open) { location.hash = "#/i/" + dup.id; return; }
      }
      const id = await api.createInspection({
        storeId: st.id, storeCode: st.code || st.id, storeName: st.name, svUid: S.me.uid, svName: S.me.name || S.user.email || "", visitDate: vd,
        status: "draft", returned: false, items: emptyItems(), special: { note: "", photos: [] },
        summary: summarize({}), checklistVersion: CHECKLIST_VERSION
      });
      location.hash = "#/i/" + id;
    } catch (e) { $("#ne").textContent = friendlyError(e); $("#go").disabled = false; }
  });
}

async function viewInspection(id, editReq = false) {
  shell(`<p class="muted">불러오는 중…</p>`, { narrow: true });
  const doc = await api.getInspection(id);
  if (!doc) { shell(`<div class="empty">점검을 찾을 수 없습니다.<br><br><a class="btn sm" href="#/">내 점검으로</a></div>`, { narrow: true }); return; }
  doc.items = doc.items || emptyItems();
  doc.special = doc.special || { note: "", photos: [] };
  const own = doc.svUid === S.me.uid;
  const ownDraft = own && doc.status === "draft";
  const masterEdit = isMaster() && editReq && !ownDraft;   // 마스터 직접 수정 모드
  const canEdit = ownDraft || masterEdit;

  const ed = { id, doc, canEdit, dirty: false, saving: false, timer: null, uploading: 0, lastSaved: null, failed: false, pend: {} };

  const photosHtml = (key) => {
    const it = itemOf(doc, key);
    const tiles = (it.photos || []).map((p, i) => `<div class="ph">
        <img src="${esc(p.thumb || p.url)}" alt="${key === SPECIAL_KEY ? "특이사항" : esc(CHECKLIST.find(c => String(c.no) === String(key))?.title)} 사진 ${i + 1}" loading="lazy" data-zoom="${esc(key)}:${i}">
        ${canEdit ? `<button class="x" data-del="${esc(key)}:${i}" aria-label="사진 ${i + 1} 삭제">×</button>` : ""}</div>`).join("");
    const pending = Array.from({ length: ed.pend?.[key] || 0 }, () => `<div class="ph up"></div>`).join("");
    const room = (it.photos || []).length + (ed.pend?.[key] || 0) < MAX_PHOTOS_PER_ITEM;
    const add = canEdit && room ? `<label class="add-ph">사진<br>추가<input type="file" accept="image/*" multiple data-add="${esc(key)}"></label>` : "";
    return tiles + pending + add;
  };

  const itemHtml = c => {
    const it = itemOf(doc, c.no);
    const cls = it.r === "Y" ? "y" : it.r === "N" ? "n" : "";
    if (!canEdit) {
      const plain = it.r === "Y" && !it.note && !(it.photos || []).length;
      return `<section class="item ${cls} ${plain ? "plain" : ""}" id="item-${c.no}">
        <div class="item-top"><div class="item-no num">${c.no}</div><div class="item-t">${esc(c.title)}</div></div>
        <div class="item-c">${esc(c.criteria)}</div>
        <div class="ro-result ${cls}">${it.r === "Y" ? "Y 준수" : it.r === "N" ? "N 미흡" : "응답 없음"}</div>
        <div class="item-body">${it.note ? `<div class="ro-note">${esc(it.note)}</div>` : ""}
          ${(it.photos || []).length ? `<div class="photos" data-photos="${c.no}">${photosHtml(c.no)}</div>` : ""}</div>
      </section>`;
    }
    return `<section class="item ${cls}" id="item-${c.no}">
      <div class="item-top"><div class="item-no num">${c.no}</div><div class="item-t">${esc(c.title)}</div></div>
      <div class="item-c">${esc(c.criteria)}</div>
      <div class="yn" role="group" aria-label="${esc(c.title)} 결과">
        <button class="y" data-yn="${c.no}:Y" aria-pressed="${it.r === "Y"}">Y 준수</button>
        <button class="n" data-yn="${c.no}:N" aria-pressed="${it.r === "N"}">N 미흡</button>
      </div>
      <div class="item-body">
        <textarea class="in" data-note="${c.no}" rows="2" placeholder="비고 (미흡 사유, 현장 조치 내용 등)" aria-label="${esc(c.title)} 비고">${esc(it.note)}</textarea>
        <div class="photos" data-photos="${c.no}">${photosHtml(c.no)}</div>
      </div></section>`;
  };

  const specialHtml = () => {
    const it = doc.special;
    if (!canEdit && !it.note && !(it.photos || []).length) return "";
    return `<div class="cat"><div class="cat-h"><div class="k" aria-hidden="true">+</div><h2>매장 특이사항</h2></div>
      <section class="item" id="item-special" style="border-left-color:var(--ink-2)">
        <div class="item-c" style="margin:0 0 8px">점검 문항 외에 시설 고장, 인력 이슈, 본사 요청사항 등을 적어 주세요.</div>
        ${canEdit ? `<textarea class="in" data-note="${SPECIAL_KEY}" rows="3" placeholder="특이사항" aria-label="매장 특이사항">${esc(it.note)}</textarea>`
                  : (it.note ? `<div class="ro-note">${esc(it.note)}</div>` : "")}
        <div class="photos" data-photos="${SPECIAL_KEY}">${photosHtml(SPECIAL_KEY)}</div>
      </section></div>`;
  };

  const railHtml = () => CATEGORIES.map(cat => {
    const its = CHECKLIST.filter(c => c.cat === cat.key);
    return `<div class="grp" style="--n:${its.length}">${its.map(c => {
      const r = doc.items[c.no]?.r;
      return `<button class="${r === "Y" ? "y" : r === "N" ? "n" : ""}" data-jump="${c.no}" aria-label="${c.no}번 ${esc(c.title)}: ${r === "Y" ? "준수" : r === "N" ? "미흡" : "미응답"}"></button>`;
    }).join("")}</div>`;
  }).join("");

  const statusText = () => {
    const sm = summarize(doc.items);
    let save = "";
    if (ed.uploading) save = `사진 올리는 중 ${ed.uploading}장`;
    else if (ed.saving) save = "저장 중…";
    else if (ed.failed) save = "저장 실패, 연결을 확인하세요";
    else if (ed.lastSaved) save = `${pad(ed.lastSaved.getHours())}:${pad(ed.lastSaved.getMinutes())} 자동 저장됨`;
    return `응답 <b class="num">${sm.answered}/${sm.total}</b>, 준수 <b class="num">${sm.y}</b>, 미흡 <b class="num">${sm.n}</b><br>${save}`;
  };

  const dock = canEdit ? `<div class="dock"><div class="dock-in">
      <div class="rail" id="rail">${railHtml()}</div>
      <div class="dock-row"><div class="st" id="st">${statusText()}</div>
        ${masterEdit ? `<button class="btn primary" id="finishEdit">수정 완료</button>` : `<button class="btn primary" id="submit">제출하기</button>`}</div></div></div>` : "";

  let acts = "";
  if (!canEdit && isMaster()) {
    if (doc.status === "submitted") acts = `<button class="btn primary" id="approve">승인</button><button class="btn" id="ret">반려 (수정 요청)</button><button class="btn" id="medit">직접 수정</button><button class="btn danger" id="delm">삭제</button>`;
    else if (doc.status === "approved") acts = `<button class="btn" id="unapprove">승인 취소</button><button class="btn" id="medit">직접 수정</button><button class="btn danger" id="delm">삭제</button>`;
    else acts = `<button class="btn danger" id="delm">삭제</button>`;
  } else if (!canEdit && own && doc.status === "submitted") {
    acts = `<button class="btn" id="svEdit">수정하기</button><button class="btn danger" id="svDel">삭제</button>`;
  }
  const masterActs = acts ? `<div class="row" style="margin:12px 0 0">${acts}</div>` : "";
  const ownDraftActs = ownDraft ? `<button class="btn sm ghost danger" id="deld" style="margin-left:auto">이 점검 삭제</button>` : "";
  const stateNotice =
    masterEdit ? `<div class="notice wait"><b>마스터 수정 중</b>: 고친 내용은 바로 저장되고 처리 이력에 남습니다. 다 고쳤으면 아래 '수정 완료'를 누르세요.</div>`
    : doc.status === "approved" ? `<div class="notice done"><b>승인 완료</b>${doc.approvedBy ? `: ${esc(doc.approvedBy)}` : ""}${doc.approvedAt ? `, ${fmtTs(doc.approvedAt)}` : ""}${!isMaster() ? "<br>승인된 점검은 마스터만 고칠 수 있습니다. 수정이 필요하면 마스터에게 요청하세요." : ""}</div>`
    : doc.status === "submitted" ? `<div class="notice wait"><b>마스터 승인 대기 중</b>${own && !isMaster() ? "<br>승인 전까지는 '수정하기'로 고치거나 삭제할 수 있습니다." : ""}</div>` : "";
  const histHtml = (doc.history || []).length ? `<h2>처리 이력</h2><div class="panel"><ul class="hist">${[...doc.history].reverse().map(h =>
    `<li><span class="num">${fmtTs(h.at)}</span><b>${esc(h.action)}</b> ${esc(h.by || "")}${h.note ? `: ${esc(h.note)}` : ""}</li>`).join("")}</ul></div>` : "";
  const ownBack = isMaster() ? "#/admin" : "#/";
  const sm = summarize(doc.items);

  shell(`
    <p style="margin:0 0 6px"><a class="small muted" href="${masterEdit ? "#/i/" + esc(id) : (own ? "#/" : ownBack)}">${masterEdit ? "보기 화면으로" : "목록으로"}</a></p>
    <div class="ins-head"><h1>${esc(doc.storeName)}</h1>${statusChip(doc)}${ownDraftActs}</div>
    <div class="ins-meta">${fmtDate(doc.visitDate)} 방문, 점검자 ${esc(doc.svName || "")}${doc.submittedAt && isSubmitted(doc) ? `, 제출 ${fmtTs(doc.submittedAt)}` : ""}</div>
    ${!canEdit ? `<div class="notice info">준수 <b class="num">${sm.y}/${sm.total}</b> (준수율 <b class="num">${sm.rate}%</b>), 미흡 ${sm.n}건, 사진 ${photoCount(doc)}장</div>` : ""}
    ${stateNotice}
    ${doc.returned && doc.status === "draft" ? `<div class="notice back"><b>수정 요청</b>${doc.returnNote ? `: ${esc(doc.returnNote)}` : ""}</div>` : ""}
    ${masterActs}
    ${!canEdit ? `<label class="small" style="display:inline-flex;gap:6px;align-items:center;margin-top:14px"><input type="checkbox" id="onlyFlag"> 미흡이거나 비고·사진이 있는 문항만 보기</label>` : ""}
    ${CATEGORIES.map(cat => {
      const its = CHECKLIST.filter(c => c.cat === cat.key);
      return `<div class="cat"><div class="cat-h"><div class="k" aria-hidden="true">${cat.key}</div><h2>${cat.label}</h2>
        <div class="c num" data-catc="${cat.key}"></div></div>${its.map(itemHtml).join("")}</div>`;
    }).join("")}
    ${specialHtml()}
    ${histHtml}
  `, { narrow: true, dock });

  const updateCatCounts = () => CATEGORIES.forEach(cat => {
    const its = CHECKLIST.filter(c => c.cat === cat.key);
    const y = its.filter(c => doc.items[c.no]?.r === "Y").length;
    const el = $(`[data-catc=${cat.key}]`); if (el) el.textContent = `준수 ${y}/${its.length}`;
  });
  updateCatCounts();

  const view = $("#view");
  // 사진 확대 / 썸네일을 못 불러오면 '사진 열기' 링크로 대체
  view.addEventListener("error", e => {
    const img = e.target;
    if (img.tagName !== "IMG" || !img.dataset.zoom) return;
    const [key, i] = img.dataset.zoom.split(":");
    const p = itemOf(doc, key).photos[Number(i)];
    const a = Object.assign(document.createElement("a"), { className: "lnk", href: p?.url || "#", target: "_blank", rel: "noopener", textContent: "사진 열기" });
    img.replaceWith(a);
  }, true);
  view.addEventListener("click", e => {
    const z = e.target.closest("[data-zoom]");
    if (!z) return;
    const [key, i] = z.dataset.zoom.split(":");
    const p = itemOf(doc, key).photos[Number(i)];
    if (p) zoom(p);
  });

  $("#onlyFlag")?.addEventListener("change", e => $("main").classList.toggle("only-flag", e.target.checked));
  const act = (sel, fn) => $(sel)?.addEventListener("click", async e => {
    e.target.disabled = true;
    try { await fn(); } catch (err) { console.error(err); toast(friendlyError(err), 4000); e.target.disabled = false; }
  });
  const clearApproval = { approvedAt: null, approvedBy: "", approvedByUid: "" };
  // 마스터: 승인 / 반려 / 승인 취소 / 직접 수정 / 삭제
  act("#approve", async () => {
    await api.updateInspection(id, { status: "approved", approvedBy: S.me.name || "", approvedByUid: S.me.uid, history: withHist(doc, "승인") }, { stamp: "approvedAt" });
    toast("승인했습니다."); router();
  });
  act("#ret", async () => {
    const note = await modal({ title: "반려 (수정 요청)", body: "점검자에게 보낼 요청 내용을 적어 주세요. 점검은 '작성 중'으로 돌아가고, 점검자가 고쳐서 다시 제출합니다.", ok: "반려하기", input: { placeholder: "예: 3번 사진 추가 필요" } });
    if (note === null) { $("#ret").disabled = false; return; }
    await api.updateInspection(id, { status: "draft", returned: true, returnNote: note, returnedBy: S.me.name || "", ...clearApproval, history: withHist(doc, "반려", note) });
    toast("반려했습니다. 점검자 화면에 수정 요청으로 표시됩니다."); router();
  });
  act("#unapprove", async () => {
    if (!await modal({ title: "승인을 취소할까요?", body: "점검이 '승인 대기'로 돌아갑니다. 이후 직접 수정하거나 반려할 수 있습니다.", ok: "승인 취소" })) { $("#unapprove").disabled = false; return; }
    await api.updateInspection(id, { status: "submitted", ...clearApproval, history: withHist(doc, "승인 취소") });
    toast("승인을 취소했습니다."); router();
  });
  act("#medit", async () => { location.hash = `#/i/${id}/edit`; });
  act("#delm", async () => {
    if (!await modal({ title: "점검을 삭제할까요?", body: "삭제한 점검은 되돌릴 수 없습니다. 드라이브의 사진 파일은 남습니다.", ok: "삭제", danger: true })) { $("#delm").disabled = false; return; }
    await api.deleteInspection(id); toast("삭제했습니다."); location.hash = isMaster() ? "#/admin" : "#/";
  });
  // SV: 승인 대기 중인 본인 점검 수정·삭제
  act("#svEdit", async () => {
    if (!await modal({ title: "제출을 취소하고 수정할까요?", body: "점검이 '작성 중'으로 돌아갑니다. 고친 뒤 다시 제출해야 마스터가 승인할 수 있습니다.", ok: "수정하기" })) { $("#svEdit").disabled = false; return; }
    await api.updateInspection(id, { status: "draft", returned: false, history: withHist(doc, "제출 취소(수정)") });
    router();
  });
  act("#svDel", async () => {
    if (!await modal({ title: "이 점검을 삭제할까요?", body: "삭제한 점검은 되돌릴 수 없습니다.", ok: "삭제", danger: true })) { $("#svDel").disabled = false; return; }
    await api.deleteInspection(id); toast("삭제했습니다."); location.hash = "#/";
  });
  if (!canEdit) return;

  /* --- 편집 동작 --- */
  const refreshDock = () => {
    const st = $("#st"); if (st) st.innerHTML = statusText();
    const rail = $("#rail"); if (rail) rail.innerHTML = railHtml();
  };
  const save = async () => {
    clearTimeout(ed.timer);
    if (ed.saving) { ed.dirty = true; return; }
    ed.saving = true; ed.dirty = false; ed.failed = false; refreshDock();
    try {
      const patch = { items: doc.items, special: doc.special, summary: summarize(doc.items) };
      const hist = masterEdit && !ed.logged ? withHist(doc, "마스터 수정") : null;   // 마스터 수정은 한 번만 이력에 남김
      if (hist) patch.history = hist;
      await api.updateInspection(id, patch);
      if (hist) { doc.history = hist; ed.logged = true; }
      ed.lastSaved = new Date();
    } catch (e) { console.error(e); ed.failed = true; ed.dirty = true; toast("저장하지 못했습니다. " + friendlyError(e)); }
    ed.saving = false; refreshDock();
    if (ed.dirty && !ed.failed) save();
  };
  const schedule = (ms = 800) => { ed.dirty = true; clearTimeout(ed.timer); ed.timer = setTimeout(save, ms); refreshDock(); };
  const renderPhotos = key => { const box = $(`[data-photos="${key}"]`); if (box) box.innerHTML = photosHtml(key); };
  const flush = async () => {
    if (ed.dirty) await save();
    while ((ed.saving || ed.dirty) && !ed.failed) await sleep(150);
    return !ed.failed;
  };

  leaveGuard = {
    nav: () => { if (ed.dirty && !ed.saving && !ed.failed) save(); return ed.uploading > 0 || ed.failed; },
    unload: () => ed.uploading > 0 || ed.saving || ed.dirty
  };

  view.addEventListener("click", async e => {
    const yn = e.target.closest("[data-yn]");
    if (yn) {
      const [no, v] = yn.dataset.yn.split(":");
      const it = itemOf(doc, no);
      it.r = it.r === v ? "" : v;
      const sec = $(`#item-${no}`);
      sec.classList.toggle("y", it.r === "Y"); sec.classList.toggle("n", it.r === "N");
      $$("[data-yn]", sec).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.yn.endsWith(":" + it.r))));
      updateCatCounts(); schedule(300);
      return;
    }
    const jump = e.target.closest("[data-jump]");
    if (jump) { $(`#item-${jump.dataset.jump}`)?.scrollIntoView({ block: "start" }); return; }
    const del = e.target.closest("[data-del]");
    if (del) {
      const [key, i] = del.dataset.del.split(":");
      if (!await modal({ title: "사진을 삭제할까요?", ok: "삭제", danger: true })) return;
      const it = itemOf(doc, key);
      const [p] = it.photos.splice(Number(i), 1);
      renderPhotos(key); save();
      if (p?.id) api.deletePhoto(p.id).catch(err => console.warn("사진 파일 삭제 실패", err));
      return;
    }
    if (e.target.id === "deld") {
      if (!await modal({ title: "이 점검을 삭제할까요?", body: "작성 중인 내용이 모두 사라집니다.", ok: "삭제", danger: true })) return;
      leaveGuard = null;
      await api.deleteInspection(id); toast("삭제했습니다."); location.hash = "#/";
      return;
    }
    if (e.target.id === "submit") submit();
    if (e.target.id === "finishEdit") finishEdit();
  });

  view.addEventListener("input", e => {
    const n = e.target.closest("[data-note]");
    if (!n) return;
    itemOf(doc, n.dataset.note).note = n.value;
    schedule();
  });

  view.addEventListener("change", async e => {
    const inp = e.target.closest("[data-add]");
    if (!inp) return;
    const key = inp.dataset.add;
    const it = itemOf(doc, key);
    const room = MAX_PHOTOS_PER_ITEM - (it.photos || []).length - (ed.pend[key] || 0);
    const files = Array.from(inp.files || []).slice(0, Math.max(0, room));
    if ((inp.files || []).length > files.length) toast(`항목당 사진은 최대 ${MAX_PHOTOS_PER_ITEM}장입니다.`);
    inp.value = "";
    if (!files.length) return;
    ed.pend[key] = (ed.pend[key] || 0) + files.length;
    ed.uploading += files.length;
    renderPhotos(key); refreshDock();
    for (const f of files) {
      try {
        const blob = await compressImage(f);
        const label = key === SPECIAL_KEY ? "특이사항" : `${key}번`;
        const p = await api.uploadPhoto(blob, {
          inspectionId: id, storeName: doc.storeName, visitDate: doc.visitDate, item: label,
          fileName: `${doc.visitDate}_${doc.storeName}_${label}_${Date.now()}.jpg`
        });
        (it.photos = it.photos || []).push(p);
      } catch (err) { console.error(err); toast("사진을 올리지 못했습니다. " + friendlyError(err), 4000); }
      ed.pend[key]--; ed.uploading--;
      renderPhotos(key); refreshDock();
    }
    save();
  });

  async function finishEdit() {
    const sm = summarize(doc.items);
    if (doc.status !== "draft" && sm.answered < sm.total) {
      const miss = CHECKLIST.filter(c => !doc.items[c.no]?.r);
      toast(`제출된 점검이라 모든 문항에 응답이 있어야 합니다. 비어 있는 문항 ${miss.length}개`);
      $(`#item-${miss[0].no}`)?.scrollIntoView({ block: "start" });
      return;
    }
    if (ed.uploading) { toast("사진을 다 올린 뒤 눌러 주세요."); return; }
    $("#finishEdit").disabled = true;
    if (!await flush()) { $("#finishEdit").disabled = false; toast("저장하지 못했습니다. 연결을 확인한 뒤 다시 눌러 주세요."); return; }
    leaveGuard = null;
    toast(ed.logged ? "수정 내용을 저장했습니다." : "바뀐 내용이 없습니다.");
    location.hash = `#/i/${id}`;
  }

  async function submit() {
    const sm = summarize(doc.items);
    if (sm.answered < sm.total) {
      const miss = CHECKLIST.filter(c => !doc.items[c.no]?.r);
      toast(`응답하지 않은 문항이 ${miss.length}개 있습니다.`);
      $(`#item-${miss[0].no}`)?.scrollIntoView({ block: "start" });
      return;
    }
    if (ed.uploading) { toast("사진을 다 올린 뒤 제출해 주세요."); return; }
    const noNote = CHECKLIST.filter(c => doc.items[c.no].r === "N" && !doc.items[c.no].note.trim());
    const body = `준수 ${sm.y}개, 미흡 ${sm.n}개입니다.` +
      (noNote.length ? `\n\n비고가 비어 있는 미흡 문항: ${noNote.map(c => c.title).join(", ")}\n미흡 사유를 적어 두면 개선 확인이 쉬워집니다.` : "") +
      "\n\n제출하면 마스터 승인 대기 상태가 됩니다. 승인 전까지는 '수정하기'로 고칠 수 있고, 승인된 뒤에는 마스터만 고칠 수 있습니다.";
    if (!await modal({ title: "점검을 제출할까요?", body: esc(body), ok: "제출하기" })) return;
    clearTimeout(ed.timer);
    $("#submit").disabled = true;
    try {
      await api.updateInspection(id, { items: doc.items, special: doc.special, summary: summarize(doc.items), status: "submitted", returned: false,
        history: withHist(doc, (doc.history || []).some(h => h.action === "제출" || h.action === "재제출") ? "재제출" : "제출") }, { stamp: "submittedAt" });
      ed.dirty = false; leaveGuard = null;
      toast("제출했습니다. 마스터 승인을 기다립니다.");
      location.hash = "#/";
    } catch (e) { $("#submit").disabled = false; toast("제출하지 못했습니다. " + friendlyError(e), 4000); }
  }
}

/* =====================================================================
   10. 마스터: 점검 내역
   ===================================================================== */
const adminFilter = { month: thisMonth(), store: "", sv: "", status: "" };

async function viewAdminList() {
  shell(`<p class="muted">불러오는 중…</p>`, { active: "#/admin" });
  await Promise.all([loadStores(), loadMembers()]);
  const { from, to } = monthRange(adminFilter.month);
  const all = await api.listInspections(from, to);
  const rows = all.filter(d =>
    (!adminFilter.store || d.storeId === adminFilter.store) &&
    (!adminFilter.sv || d.svUid === adminFilter.sv) &&
    (!adminFilter.status || (adminFilter.status === "draft" ? !isSubmitted(d) : d.status === adminFilter.status)));
  const sub = rows.filter(isSubmitted);
  const waiting = rows.filter(d => d.status === "submitted");
  const avg = sub.length ? Math.round(sub.reduce((a, d) => a + (d.summary?.rate ?? summarize(d.items).rate), 0) / sub.length) : null;
  const visited = new Set(sub.map(d => d.storeId));
  const activeStores = S.stores.filter(s => s.active !== false);
  const svs = S.members.filter(m => m.active !== false);

  shell(`
    <h1>점검 내역</h1>
    <div class="panel" style="margin-bottom:12px"><div class="row">
      <div><label class="f" for="fm" style="margin-top:0">월</label><input class="in" id="fm" type="month" value="${adminFilter.month}"></div>
      <div><label class="f" for="fs" style="margin-top:0">매장</label><select class="in" id="fs"><option value="">전체 매장</option>${S.stores.map(s => `<option value="${esc(s.id)}" ${s.id === adminFilter.store ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
      <div><label class="f" for="fv" style="margin-top:0">점검자</label><select class="in" id="fv"><option value="">전체</option>${svs.map(m => `<option value="${esc(m.uid)}" ${m.uid === adminFilter.sv ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></div>
      <div><label class="f" for="ft" style="margin-top:0">상태</label><select class="in" id="ft">
        <option value="">전체</option>
        <option value="submitted" ${adminFilter.status === "submitted" ? "selected" : ""}>승인 대기</option>
        <option value="approved" ${adminFilter.status === "approved" ? "selected" : ""}>승인 완료</option>
        <option value="draft" ${adminFilter.status === "draft" ? "selected" : ""}>작성 중</option></select></div>
      <button class="btn" id="xl">엑셀로 내려받기</button>
    </div></div>
    <div class="stats">
      <button class="stat click ${adminFilter.status === "submitted" ? "on" : ""}" id="waitCard" type="button"><b class="num">${waiting.length}</b><span>승인 대기 (눌러서 보기)</span></button>
      <div class="stat"><b class="num">${sub.length}</b><span>제출된 점검 (승인 대기 포함)</span></div>
      <div class="stat"><b class="num">${avg === null ? "-" : avg + "%"}</b><span>평균 준수율</span></div>
      <div class="stat"><b class="num">${visited.size}/${activeStores.length}</b><span>방문한 매장</span></div>
    </div>
    ${waiting.length ? `<div class="bulk"><button class="btn primary sm" id="bulk" disabled>선택한 점검 승인</button><span class="muted small">승인 대기 점검은 왼쪽 칸을 체크해 한 번에 승인할 수 있습니다.</span></div>` : ""}
    ${rows.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>${waiting.length ? `<input type="checkbox" id="pickAll" aria-label="승인 대기 전체 선택">` : ""}</th><th>방문일</th><th>매장</th><th>점검자</th><th class="r">준수</th><th>미흡 문항</th><th class="r">사진</th><th>상태</th></tr></thead>
      <tbody>${rows.map(d => {
        const sm = d.summary || summarize(d.items);
        return `<tr class="click" data-open="${esc(d.id)}" tabindex="0">
          <td>${d.status === "submitted" ? `<input type="checkbox" data-pick="${esc(d.id)}" aria-label="${esc(d.storeName)} 승인 선택">` : ""}</td>
          <td class="num">${esc(d.visitDate)}</td><td>${esc(d.storeName)}</td><td>${esc(d.svName || memberName(d.svUid))}</td>
          <td class="r num">${sm.y}/${sm.total}</td><td class="wrap">${esc(nTitles(d).join(", ") || "-")}</td>
          <td class="r num">${photoCount(d)}</td><td>${statusChip(d)}</td></tr>`;
      }).join("")}</tbody></table></div>` : `<div class="empty">이 조건에 맞는 점검이 없습니다.</div>`}
  `, { active: "#/admin" });

  const refilter = () => {
    adminFilter.month = $("#fm").value || thisMonth();
    adminFilter.store = $("#fs").value; adminFilter.sv = $("#fv").value; adminFilter.status = $("#ft").value;
    viewAdminList();
  };
  ["#fm", "#fs", "#fv", "#ft"].forEach(s => $(s).addEventListener("change", refilter));
  $("#waitCard").addEventListener("click", () => { adminFilter.status = adminFilter.status === "submitted" ? "" : "submitted"; viewAdminList(); });
  $$("[data-open]").forEach(tr => {
    tr.addEventListener("click", e => { if (e.target.closest("input")) return; location.hash = "#/i/" + tr.dataset.open; });
    tr.addEventListener("keydown", e => { if (e.key === "Enter" && !e.target.closest("input")) location.hash = "#/i/" + tr.dataset.open; });
  });
  const picks = () => $$("[data-pick]").filter(c => c.checked).map(c => c.dataset.pick);
  const syncBulk = () => { const n = picks().length; const b = $("#bulk"); if (b) { b.disabled = !n; b.textContent = n ? `선택한 ${n}건 승인` : "선택한 점검 승인"; } };
  $$("[data-pick]").forEach(c => c.addEventListener("change", syncBulk));
  $("#pickAll")?.addEventListener("change", e => { $$("[data-pick]").forEach(c => { c.checked = e.target.checked; }); syncBulk(); });
  $("#bulk")?.addEventListener("click", async () => {
    const ids = picks();
    if (!ids.length) return;
    if (!await modal({ title: `${ids.length}건을 승인할까요?`, body: "승인한 점검은 SV가 고칠 수 없습니다. 필요하면 상세 화면에서 승인을 취소할 수 있습니다.", ok: "승인" })) return;
    $("#bulk").disabled = true;
    let ok = 0;
    for (const id of ids) {
      const d = rows.find(x => x.id === id);
      try {
        await api.updateInspection(id, { status: "approved", approvedBy: S.me.name || "", approvedByUid: S.me.uid, history: withHist(d, "승인") }, { stamp: "approvedAt" });
        ok++;
      } catch (e) { console.error(e); }
    }
    toast(ok === ids.length ? `${ok}건을 승인했습니다.` : `${ok}건 승인, ${ids.length - ok}건은 실패했습니다. 다시 시도해 주세요.`, 3500);
    viewAdminList();
  });
  $("#xl").addEventListener("click", () => exportExcel(rows, adminFilter.month));
}

function exportExcel(rows, month) {
  const head = ["방문일", "매장코드", "매장", "점검자", "상태", "준수", "미흡", "준수율(%)"];
  CHECKLIST.forEach(c => head.push(`${c.no}.${c.title} 결과`, `${c.no}.${c.title} 비고`, `${c.no}.${c.title} 사진`));
  head.push("매장 특이사항", "특이사항 사진", "제출 일시", "승인자", "승인 일시", "점검 문항 버전");
  const data = rows.map(d => {
    const sm = d.summary || summarize(d.items);
    const r = [d.visitDate, d.storeCode || d.storeId, d.storeName, d.svName || memberName(d.svUid), statusLabel(d), sm.y, sm.n, sm.rate];
    CHECKLIST.forEach(c => {
      const it = d.items?.[c.no] || {};
      r.push(it.r || "", it.note || "", (it.photos || []).map(p => p.url).join("\n"));
    });
    r.push(d.special?.note || "", (d.special?.photos || []).map(p => p.url).join("\n"), isSubmitted(d) ? fmtTs(d.submittedAt) : "",
      d.status === "approved" ? (d.approvedBy || "") : "", d.status === "approved" ? fmtTs(d.approvedAt) : "", d.checklistVersion || "");
    return r;
  });
  const name = `벤슨_매장점검_${month}`;
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet([head, ...data]);
    ws["!cols"] = head.map((h, i) => ({ wch: i < 4 ? 14 : h.endsWith("비고") || h.includes("특이사항") ? 30 : 10 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "점검 결과");
    XLSX.writeFile(wb, name + ".xlsx");
  } else {
    const csv = [head, ...data].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = name + ".csv"; a.click();
  }
  toast("엑셀 파일을 내려받았습니다.");
}

/* =====================================================================
   11. 마스터: 매장별 현황
   ===================================================================== */
async function viewAdminStats() {
  shell(`<p class="muted">불러오는 중…</p>`, { active: "#/admin/stats" });
  await Promise.all([loadStores(), loadMembers()]);
  const { from, to } = monthRange(adminFilter.month);
  const sub = (await api.listInspections(from, to)).filter(isSubmitted);
  const activeStores = S.stores.filter(s => s.active !== false);

  const byStore = activeStores.map(s => {
    const list = sub.filter(d => d.storeId === s.id).sort((a, b) => b.visitDate.localeCompare(a.visitDate));
    const avg = list.length ? Math.round(list.reduce((a, d) => a + (d.summary?.rate ?? summarize(d.items).rate), 0) / list.length) : null;
    return { s, list, avg, last: list[0], lastN: list[0] ? nTitles(list[0]) : [] };
  }).sort((a, b) => (a.list.length === 0) - (b.list.length === 0) || (a.avg ?? 101) - (b.avg ?? 101));
  const unvisited = byStore.filter(x => !x.list.length);

  const byItem = CHECKLIST.map(c => {
    const n = sub.filter(d => d.items?.[c.no]?.r === "N").length;
    return { c, n, pct: sub.length ? Math.round(n / sub.length * 100) : 0 };
  });
  const maxN = Math.max(1, ...byItem.map(x => x.n));

  const groups = {};
  activeStores.forEach(s => { const n = svNameOf(s) || "담당 미지정"; (groups[n] = groups[n] || []).push(s); });
  const bySv = Object.entries(groups).map(([name, ss]) => {
    const ids = new Set(ss.map(s => s.id));
    const list = sub.filter(d => ids.has(d.storeId));
    const seen = new Set(list.map(d => d.storeId));
    const avg = list.length ? Math.round(list.reduce((a, d) => a + (d.summary?.rate ?? summarize(d.items).rate), 0) / list.length) : null;
    return { name, total: ss.length, seen: seen.size, count: list.length, avg, missing: ss.filter(s => !seen.has(s.id)).map(s => s.name) };
  }).sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const mon = Number(adminFilter.month.slice(5));

  shell(`
    <h1>매장별 현황</h1>
    <div class="row" style="margin-bottom:12px;max-width:260px"><div><label class="f" for="fm" style="margin-top:0">월</label><input class="in" id="fm" type="month" value="${adminFilter.month}"></div></div>
    ${unvisited.length ? `<div class="notice back">${mon}월에 제출된 점검이 없는 매장이 ${unvisited.length}곳입니다. SV별 목록은 아래 표에서 볼 수 있습니다.</div>` : (activeStores.length ? `<div class="notice info">${mon}월에 모든 매장의 점검이 제출됐습니다.</div>` : "")}
    ${bySv.length ? `<h2>SV별 담당 매장 점검</h2><div class="tbl-wrap"><table>
      <thead><tr><th>담당 SV</th><th class="r">담당 매장</th><th class="r">점검한 매장</th><th style="width:22%"></th><th class="r">점검 건수</th><th class="r">평균 준수율</th><th>아직 점검하지 않은 매장</th></tr></thead>
      <tbody>${bySv.map(x => `<tr><td>${esc(x.name)}</td><td class="r num">${x.total}</td><td class="r num">${x.seen}</td>
        <td><div class="bar y"><i style="width:${x.total ? Math.round(x.seen / x.total * 100) : 0}%"></i></div></td>
        <td class="r num">${x.count}</td><td class="r num">${x.avg === null ? "-" : x.avg + "%"}</td>
        <td class="wrap">${esc(x.missing.join(", ") || "없음")}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="split">
      <div><h2>매장별</h2>
        ${activeStores.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th>매장</th><th>담당</th><th class="r">방문</th><th>최근 방문</th><th class="r">평균 준수율</th><th>최근 미흡 문항</th></tr></thead>
        <tbody>${byStore.map(x => `<tr ${x.last ? `class="click" data-open="${esc(x.last.id)}" tabindex="0"` : ""}>
          <td>${esc(x.s.name)}</td><td>${esc(svNameOf(x.s) || "-")}</td>
          <td class="r num">${x.list.length}</td><td class="num">${x.last ? esc(x.last.visitDate) : "-"}</td>
          <td class="r num">${x.avg === null ? "-" : x.avg + "%"}</td><td class="wrap">${esc(x.lastN.join(", ") || (x.last ? "없음" : "-"))}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">등록된 매장이 없습니다.</div>`}
      </div>
      <div><h2>문항별 미흡 건수</h2>
        <div class="tbl-wrap"><table>
        <thead><tr><th>문항</th><th class="r">미흡</th><th style="width:40%"></th></tr></thead>
        <tbody>${byItem.map(x => `<tr><td>${x.c.no}. ${esc(x.c.title)}</td><td class="r num">${x.n}건${sub.length ? ` (${x.pct}%)` : ""}</td>
          <td><div class="bar"><i style="width:${Math.round(x.n / maxN * 100)}%"></i></div></td></tr>`).join("")}</tbody></table></div>
        <p class="muted small" style="margin-top:8px">제출된 점검 ${sub.length}건 기준입니다 (승인 대기 ${sub.filter(d => d.status === "submitted").length}건 포함).</p>
      </div>
    </div>
  `, { active: "#/admin/stats" });
  $("#fm").addEventListener("change", () => { adminFilter.month = $("#fm").value || thisMonth(); viewAdminStats(); });
  $$("[data-open]").forEach(tr => {
    tr.addEventListener("click", () => location.hash = "#/i/" + tr.dataset.open);
    tr.addEventListener("keydown", e => { if (e.key === "Enter") location.hash = "#/i/" + tr.dataset.open; });
  });
}

/* =====================================================================
   12. 마스터: 매장 관리
   ===================================================================== */
async function viewAdminStores() {
  shell(`<p class="muted">불러오는 중…</p>`, { active: "#/admin/stores" });
  await Promise.all([loadStores(), loadMembers()]);
  const members = S.members.filter(m => m.active !== false);
  const have = new Set(S.stores.flatMap(x => [x.id, x.code]).filter(Boolean));
  const missingSeed = STORE_SEED.filter(([code]) => !have.has(code));
  const svOpts = st => {
    const cur = st ? svUidOf(st) : "";
    const pending = st && !cur && st.svName ? `<option value="__pending" selected>${esc(st.svName)} (계정 없음)</option>` : "";
    return pending + `<option value="" ${!cur && !pending ? "selected" : ""}>미지정</option>` +
      members.map(m => `<option value="${esc(m.uid)}" ${m.uid === cur ? "selected" : ""}>${esc(m.name)}</option>`).join("");
  };
  const unlinked = S.stores.filter(x => x.active !== false && !svUidOf(x) && x.svName);
  shell(`
    <h1>매장 관리</h1>
    ${missingSeed.length ? `<div class="panel" style="margin-bottom:12px">
      <h2 style="margin-top:0">기본 매장 목록 등록</h2>
      <p class="muted small">매장코드·담당 SV가 포함된 벤슨 매장 ${STORE_SEED.length}곳 중 ${missingSeed.length}곳이 아직 등록되지 않았습니다. SV 계정을 같은 이름으로 만들면 담당 매장이 자동으로 연결됩니다.</p>
      <div class="err" id="sde"></div>
      <button class="btn primary" id="seed">${missingSeed.length}곳 한 번에 등록</button></div>` : ""}
    ${unlinked.length ? `<div class="notice info">담당 SV 계정이 아직 없는 매장이 ${unlinked.length}곳 있습니다 (${esc([...new Set(unlinked.map(x => x.svName))].join(", "))}). '사용자 관리'에서 같은 이름으로 계정을 만들면 자동으로 연결됩니다.</div>` : ""}
    <div class="split">
      <div>
        ${S.stores.length ? `<div class="tbl-wrap"><table>
          <thead><tr><th>코드</th><th>매장</th><th>담당 SV</th><th>사용</th></tr></thead>
          <tbody>${S.stores.map(x => `<tr>
            <td class="num">${esc(x.code || "-")}</td><td>${esc(x.name)}</td>
            <td><select class="in" style="min-height:36px;padding:4px 8px" data-sv="${esc(x.id)}" aria-label="${esc(x.name)} 담당 SV">${svOpts(x)}</select></td>
            <td><label><input type="checkbox" data-act="${esc(x.id)}" ${x.active !== false ? "checked" : ""}> 사용</label></td></tr>`).join("")}
          </tbody></table></div>
          <p class="muted small" style="margin-top:8px">'사용'을 끄면 새 점검의 매장 목록에서 빠집니다. 지난 점검 기록은 그대로 남습니다.</p>`
        : `<div class="empty">아직 매장이 없습니다. 위의 '한 번에 등록'을 누르거나 오른쪽에서 매장을 추가하세요.</div>`}
      </div>
      <div class="panel">
        <h2 style="margin-top:0">매장 추가</h2>
        <label class="f" for="nm">한 줄에 한 매장씩 입력하세요</label>
        <textarea class="in" id="nm" rows="5" placeholder="BSC0030	신규점	담당자이름&#10;또는 매장명만"></textarea>
        <p class="muted small" style="margin-top:6px">엑셀에서 '매장코드, 매장명, 담당 SV' 세 칸을 그대로 복사해 붙여넣어도 됩니다.</p>
        <label class="f" for="nsv">담당 SV (줄에 담당자가 없을 때)</label><select class="in" id="nsv">${svOpts(null)}</select>
        <div class="err" id="se"></div>
        <button class="btn primary block" id="add">매장 추가</button>
      </div>
    </div>`, { active: "#/admin/stores" });

  $("#seed")?.addEventListener("click", async () => {
    $("#seed").disabled = true;
    try {
      for (const [code, name, sv] of missingSeed) {
        const uid = members.find(m => m.name === sv)?.uid || "";
        await api.setStore(code, { code, name, svName: sv, svUid: uid, active: true });
      }
      toast(`매장 ${missingSeed.length}곳을 등록했습니다.`); viewAdminStores();
    } catch (e) { $("#sde").textContent = friendlyError(e); $("#seed").disabled = false; }
  });
  $$("[data-sv]").forEach(sel => sel.addEventListener("change", async () => {
    if (sel.value === "__pending") return;
    try {
      await api.updateStore(sel.dataset.sv, { svUid: sel.value, svName: sel.value ? memberName(sel.value) : "" });
      toast("담당 SV를 바꿨습니다.");
    } catch (e) { toast(friendlyError(e)); }
  }));
  $$("[data-act]").forEach(cb => cb.addEventListener("change", async () => {
    try { await api.updateStore(cb.dataset.act, { active: cb.checked }); toast(cb.checked ? "사용으로 바꿨습니다." : "사용 중지했습니다."); } catch (e) { toast(friendlyError(e)); }
  }));
  $("#add").addEventListener("click", async () => {
    const pick = $("#nsv").value;
    const defSv = pick && pick !== "__pending" ? memberName(pick) : "";
    const rows = $("#nm").value.split(/\n/).map(t => t.trim()).filter(Boolean).map(line => {
      const parts = line.split(/\t|\s{2,}/).map(t => t.trim()).filter(Boolean);
      if (parts.length >= 2 && /^[A-Za-z]{2,}\d{2,}$/.test(parts[0])) return { code: parts[0].toUpperCase(), name: parts[1], sv: parts[2] || defSv };
      return { code: "", name: line, sv: defSv };
    });
    if (!rows.length) return $("#se").textContent = "매장을 입력해 주세요.";
    const names = new Set(S.stores.map(x => x.name));
    const fresh = rows.filter(r => !(r.code && have.has(r.code)) && !names.has(r.name));
    if (!fresh.length) return $("#se").textContent = "이미 등록된 매장입니다.";
    $("#add").disabled = true;
    try {
      for (const r of fresh) {
        const data = { code: r.code, name: r.name, svName: r.sv, svUid: members.find(m => m.name === r.sv)?.uid || "", active: true };
        if (r.code) await api.setStore(r.code, data); else await api.addStore(data);
      }
      toast(`매장 ${fresh.length}곳을 추가했습니다.`); viewAdminStores();
    } catch (e) { $("#se").textContent = friendlyError(e); $("#add").disabled = false; }
  });
}

/* =====================================================================
   13. 마스터: 사용자 관리
   ===================================================================== */
async function viewAdminUsers() {
  shell(`<p class="muted">불러오는 중…</p>`, { active: "#/admin/users" });
  await loadMembers();
  shell(`
    <h1>사용자 관리</h1>
    <div class="split">
      <div><div class="tbl-wrap"><table>
        <thead><tr><th>이름</th><th>이메일</th><th>역할</th><th>사용</th></tr></thead>
        <tbody>${S.members.map(m => {
          const self = m.uid === S.me.uid;
          return `<tr><td>${esc(m.name)}${self ? ' <span class="chip">나</span>' : ""}</td><td>${esc(m.email || "")}</td>
          <td><select class="in" style="min-height:36px;padding:4px 8px" data-role="${esc(m.uid)}" ${self ? "disabled" : ""} aria-label="${esc(m.name)} 역할">
            <option value="sv" ${m.role !== "master" ? "selected" : ""}>SV</option><option value="master" ${m.role === "master" ? "selected" : ""}>마스터</option></select></td>
          <td><label><input type="checkbox" data-on="${esc(m.uid)}" ${m.active !== false ? "checked" : ""} ${self ? "disabled" : ""}> 사용</label></td></tr>`;
        }).join("")}</tbody></table></div>
        <p class="muted small" style="margin-top:8px">퇴사·전보 시 '사용'을 끄면 즉시 로그인해도 아무것도 볼 수 없습니다. 마스터는 모든 점검을 보고, SV는 본인 점검만 봅니다.</p>
      </div>
      <div>
        <div class="panel">
          <h2 style="margin-top:0">계정 만들기</h2>
          <label class="f" for="un">이름 (매장 목록의 담당자 이름과 똑같이)</label><input class="in" id="un">
          <label class="f" for="ue">이메일 (로그인 ID)</label><input class="in" id="ue" type="email">
          <label class="f" for="up">임시 비밀번호 (6자 이상)</label><input class="in" id="up" type="text" autocomplete="off">
          <label class="f" for="ur">역할</label><select class="in" id="ur"><option value="sv">SV</option><option value="master">마스터</option></select>
          <div class="err" id="ue1"></div>
          <button class="btn primary block" id="mk">계정 만들기</button>
          <p class="muted small" style="margin-top:10px">만든 뒤 이메일과 임시 비밀번호를 본인에게 전달하고, 첫 로그인 후 '계정 > 비밀번호 변경'을 안내하세요.</p>
        </div>
        <div class="panel" style="margin-top:12px">
          <h2 style="margin-top:0">기존 계정 등록</h2>
          <p class="muted small">Firebase 콘솔에서 직접 만든 계정은, 그 사람이 로그인했을 때 화면에 뜨는 사용자 ID로 등록합니다.</p>
          <label class="f" for="ruid">사용자 ID</label><input class="in" id="ruid">
          <div class="row"><div><label class="f" for="rn">이름</label><input class="in" id="rn"></div>
            <div><label class="f" for="rr">역할</label><select class="in" id="rr"><option value="sv">SV</option><option value="master">마스터</option></select></div></div>
          <label class="f" for="re">이메일 (표시용)</label><input class="in" id="re" type="email">
          <div class="err" id="ue2"></div>
          <button class="btn block" id="rg">등록하기</button>
        </div>
      </div>
    </div>`, { active: "#/admin/users" });

  $$("[data-role]").forEach(sel => sel.addEventListener("change", async () => {
    try { await api.updateMember(sel.dataset.role, { role: sel.value }); toast("역할을 바꿨습니다."); } catch (e) { toast(friendlyError(e)); }
  }));
  $$("[data-on]").forEach(cb => cb.addEventListener("change", async () => {
    try { await api.updateMember(cb.dataset.on, { active: cb.checked }); toast(cb.checked ? "사용으로 바꿨습니다." : "사용 중지했습니다."); } catch (e) { toast(friendlyError(e)); }
  }));
  $("#mk").addEventListener("click", async () => {
    const name = $("#un").value.trim(), email = $("#ue").value.trim(), password = $("#up").value, role = $("#ur").value;
    if (!name || !email) return $("#ue1").textContent = "이름과 이메일을 입력해 주세요.";
    if (password.length < 6) return $("#ue1").textContent = "임시 비밀번호는 6자 이상이어야 합니다.";
    $("#mk").disabled = true;
    try {
      const uid = await api.createMember({ name, email, password, role });
      const k = await linkStoresTo(uid, name);
      toast(`${name} 계정을 만들었습니다.${k ? ` 담당 매장 ${k}곳을 연결했습니다.` : ""}`, 3500); viewAdminUsers();
    }
    catch (e) { $("#ue1").textContent = friendlyError(e); $("#mk").disabled = false; }
  });
  $("#rg").addEventListener("click", async () => {
    const uid = $("#ruid").value.trim(), name = $("#rn").value.trim(), email = $("#re").value.trim(), role = $("#rr").value;
    if (!uid || !name) return $("#ue2").textContent = "사용자 ID와 이름을 입력해 주세요.";
    $("#rg").disabled = true;
    try {
      await api.registerMember(uid, { name, email, role });
      const k = await linkStoresTo(uid, name);
      toast(`${name}님을 등록했습니다.${k ? ` 담당 매장 ${k}곳을 연결했습니다.` : ""}`, 3500); viewAdminUsers();
    }
    catch (e) { $("#ue2").textContent = friendlyError(e); $("#rg").disabled = false; }
  });
}

/* =====================================================================
   14. 시작
   ===================================================================== */
(async function start() {
  try {
    api = FIREBASE_CONFIG.apiKey ? await createFirebaseApi() : createDemoApi();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<main class="narrow"><div class="empty">Firebase를 불러오지 못했습니다. 인터넷 연결과 설정값을 확인해 주세요.<br><span class="small">${esc(e.message)}</span></div></main>`;
    return;
  }
  api.onAuth(async user => {
    S.user = user; S.me = null; leaveGuard = null;
    if (!user) { history.replaceState(null, "", location.pathname + location.search); lastHash = ""; return viewLogin(); }
    try {
      const me = await api.getMember(user.uid);
      if (!me) return viewNoAccess("관리자에게 아래 사용자 ID를 전달해 등록을 요청하세요.");
      if (me.active === false) return viewNoAccess("사용이 중지된 계정입니다. 관리자에게 문의하세요.");
      S.me = me;
      if (isMaster()) await loadMembers();
      lastHash = location.hash;
      router();
    } catch (e) {
      console.error(e);
      viewNoAccess(friendlyError(e));
    }
  });
})();
</script>
